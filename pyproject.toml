[project]
name = "draftsight-com"
version = "0.6.0"
description = "Drive a running DraftSight app over COM from Python: draw, dimension, hatch, save DWG, export proof images, and search the vendor CHM help."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["draftsight", "cad", "com", "win32", "pywin32", "dwg", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics :: Presentation",
]
# pywin32 is only reachable through COM, so the marker keeps a non-Windows
# install (CI, a laptop that merely reads the references) from failing on it.
dependencies = ["pywin32>=306; sys_platform == 'win32'"]

[project.optional-dependencies]
# The SVG/pixel rigs in references/draftsight-api.md measure rendered text height and dash
# length; they need an image decoder and arrays.
docs = ["numpy>=1.26", "pillow>=10"]

[project.scripts]
draftsight_com = "draftsight_com:main"
ds-docs = "draftsight_com.docs:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/draftsight_com"]

[tool.hatch.build.targets.sdist]
# The skill and the references travel with the source distribution on purpose: they are the
# verified part of this package, and a source build should carry them. The decompiled CHM tree
# (docs/) is vendor copyrighted and regenerable with `ds-docs decompile`, so it stays out.
include = ["src", "examples", "references", "tests", "README.md", "SKILL.md"]
exclude = ["docs", ".pi"]
