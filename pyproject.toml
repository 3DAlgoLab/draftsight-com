[project]
name = "prime-agent-skill-draftsight-com"
version = "0.1.0"
description = "Drive a running DraftSight app over COM from the Python kernel: draw, dimension, save DWG, export proof images."
requires-python = ">=3.11"
dependencies = ["pywin32>=306"]

[project.scripts]
draftsight_com = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/draftsight_com"]
